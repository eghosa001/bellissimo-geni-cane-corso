name = "bellissimo-geni-webhook"
main = "handler.js"
compatibility_date = "2024-12-01"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PuppyLock"]

[[durable_objects.bindings]]
name = "PUPPY_LOCK"
class_name = "PuppyLock"

# Wrangler 4.45+ automatically provisions KV and R2 resources when bindings
# are declared without account-specific IDs/names.
[[kv_namespaces]]
binding = "RESERVATIONS"

[[kv_namespaces]]
binding = "ADMIN"

[[r2_buckets]]
binding = "UPLOADS"

workers_dev = true

[vars]
PAYMENT_PROVIDER = "none"    # "paystack" or "flutterwave" or "none"
RESERVATION_AMOUNT = "0"     # deposit amount in NGN
PAYMENT_CURRENCY = "NGN"
RESERVATION_HOLD_HOURS = "72"
