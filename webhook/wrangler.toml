name = "bellissimo-geni-webhook"
main = "handler.js"
compatibility_date = "2024-12-01"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PuppyLock"]

[[durable_objects.bindings]]
name = "PUPPY_LOCK"
class_name = "PuppyLock"

[[kv_namespaces]]
binding = "RESERVATIONS"
id = ""
preview_id = ""

[[kv_namespaces]]
binding = "ADMIN"
id = ""
preview_id = ""

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = ""
preview_bucket_name = ""

[vars]
PAYMENT_PROVIDER = "none"
RESERVATION_AMOUNT = "0"
PAYMENT_CURRENCY = "NGN"
RESERVATION_HOLD_HOURS = "72"
