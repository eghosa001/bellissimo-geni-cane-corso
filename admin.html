<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellissimo Geni — Kennel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
/* ── Admin Shell ─────────────────────────────────────────────────────────── */
:root{--ink:#10100f;--paper:#f4f1ea;--muted:#655f56;--gold:#c7a35a;--line:rgba(16,16,15,.13);--dark:#121211;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}

/* ── Login Screen ────────────────────────────────────────────────────────── */
.login-screen{min-height:100vh;display:grid;place-items:center;background:var(--dark)}
.login-box{background:var(--paper);border:1px solid var(--line);padding:48px 40px;width:100%;max-width:400px}
.login-box h1{font:600 clamp(28px,4vw,40px)/.95 var(--serif);letter-spacing:-.03em;margin-bottom:6px}
.login-box .sub{color:var(--muted);font-size:12px;letter-spacing:.14em;margin-bottom:32px}
.login-box label{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:20px}
.login-box input{width:100%;border:1px solid var(--line);padding:14px 16px;background:#fff;margin-top:6px;outline:none;font-size:15px}
.login-box input:focus{border-color:var(--gold)}
.login-box .btn-login{margin-top:28px;width:100%;padding:14px;background:var(--gold);border:0;font-weight:800;font-size:13px;letter-spacing:.08em;cursor:pointer;color:#10100f}
.login-box .login-err{margin-top:14px;font-size:12px;color:#b33;min-height:18px}

/* ── Admin Layout ────────────────────────────────────────────────────────── */
.admin-wrap{display:none;height:100vh;overflow:hidden}
.admin-wrap.active{display:flex}

/* Sidebar */
.sidebar{width:240px;min-width:240px;background:var(--dark);color:#e8e4dc;display:flex;flex-direction:column;height:100vh;overflow-y:auto;flex-shrink:0}
.sidebar-brand{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand .mark{width:36px;height:36px;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:14px;color:var(--gold);margin-bottom:10px}
.sidebar-brand b{display:block;font-size:10px;letter-spacing:.18em;color:#c8c0b0}
.sidebar-brand small{display:block;font-size:8px;letter-spacing:.16em;color:#655f56;margin-top:2px}
.sidebar-nav{flex:1;padding:12px 0}
.nav-section{font-size:9px;letter-spacing:.2em;color:#555;padding:16px 20px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;font-weight:600;color:#a8a49a;cursor:pointer;border-left:2px solid transparent;transition:all .15s}
.nav-item:hover{color:#e8e4dc;background:rgba(255,255,255,.04)}
.nav-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(199,163,90,.06)}
.nav-item .count{margin-left:auto;font-size:10px;background:rgba(255,255,255,.08);padding:2px 7px;border-radius:10px;font-weight:700;color:#888}
.nav-item.active .count{background:rgba(199,163,90,.15);color:var(--gold)}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:10px;color:#555}
.btn-logout{background:transparent;border:1px solid rgba(255,255,255,.15);color:#888;padding:8px 14px;font-size:11px;font-weight:700;cursor:pointer;width:100%;letter-spacing:.06em}
.btn-logout:hover{border-color:var(--gold);color:var(--gold)}

/* Main area */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:#fff;flex-shrink:0}
.topbar h2{font:600 20px var(--serif);letter-spacing:-.02em}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-date{font-size:11px;color:var(--muted)}
.content-scroll{flex:1;overflow-y:auto;padding:32px}

/* ── Cards & Panels ──────────────────────────────────────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:#fff;border:1px solid var(--line);padding:20px 22px}
.stat-card .num{font:600 clamp(28px,4vw,38px)/.95 var(--serif);color:var(--ink);letter-spacing:-.02em}
.stat-card .label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:700}
.stat-card .label a{color:var(--gold);text-decoration:underline}

.panel{background:#fff;border:1px solid var(--line);margin-bottom:24px}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.panel-header h3{font:600 16px var(--serif);letter-spacing:-.01em}
.panel-body{padding:22px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;font-size:12px;font-weight:800;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;letter-spacing:.03em}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#10100f}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-sm{padding:7px 12px;font-size:11px}
.btn-del{background:#b33;border-color:#b33;color:#fff}
.btn-del:hover{background:#a22}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

/* Tables */
.datatable{width:100%;border-collapse:collapse;font-size:13px}
.datatable th{text-align:left;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:10px 14px;border-bottom:1px solid var(--line);background:#faf8f4}
.datatable td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.datatable tr:last-child td{border-bottom:0}
.datatable tr:hover td{background:#faf8f4}
.datatable .name{font:600 14px var(--serif);letter-spacing:-.01em}
.datatable .muted{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.12em;padding:4px 9px;border:1px solid var(--line);text-transform:uppercase}
.pill.available{background:#e6f0e3;border-color:#9dbf9a;color:#2d5a27}
.pill.reserved{background:#f7ecd2;border-color:var(--gold);color:#7a5f0e}
.pill.sold{background:#eee;color:#888}
.pill.unavailable{background:#eee;color:#888}
.pill.coming-soon{background:#e8e4da}
.pill.payment-pending{background:#f7ecd2;border-color:var(--gold)}
.pill.development{background:#f0ebe0;color:#777}
.pill.featured{background:var(--gold);border-color:var(--gold);color:#10100f}
.pill.approved{background:#e6f0e3;border-color:#9dbf9a}
.pill.unapproved{background:#f5f0e6;border-color:#d4c9a8}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);padding:11px 14px;background:#faf8f4;outline:none;font-size:14px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);background:#fff}
.field textarea{resize:vertical;min-height:80px}
.field .hint{font-size:11px;color:var(--muted)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(16,16,15,.55);z-index:100;display:none;place-items:center;padding:20px}
.modal-overlay.open{display:grid}
.modal{background:var(--paper);border:1px solid var(--line);width:100%;max-width:680px;max-height:90vh;overflow-y:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-head h3{font:600 20px var(--serif);letter-spacing:-.02em}
.modal-close{background:transparent;border:0;font-size:18px;cursor:pointer;color:var(--muted);padding:4px 8px}
.modal-close:hover{color:var(--ink)}
.modal-body{padding:24px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:#fff}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--dark);color:#f4f1ea;padding:14px 20px;font-size:13px;font-weight:600;z-index:200;transform:translateY(80px);opacity:0;transition:all .3s ease}
.toast.show{transform:none;opacity:1}
.toast.err{background:#b33}

/* Search bar in panel */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.toolbar input,.toolbar select{border:1px solid var(--line);padding:10px 14px;background:#fff;min-width:160px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--gold)}

/* Responsive */
@media(max-width:900px){
  .sidebar{width:200px;min-width:200px}
  .form-grid{grid-template-columns:1fr}
}
@media(max-width:700px){
  .sidebar{position:fixed;left:-260px;z-index:90;transition:left .25s}
  .sidebar.open{left:0}
  .content-scroll{padding:20px}
  .stats-row{grid-template-columns:1fr 1fr}
  .mobile-toggle{display:inline-flex !important}
}
.mobile-toggle{display:none !important;border:1px solid var(--line);background:#fff;padding:8px 12px;font-weight:700;font-size:12px;cursor:pointer}
.overlay-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80}
.overlay-bg.open{display:block}

/* ── Upload zone ─────────────────────────────────────────────────────────── */
.upload-zone{border:2px dashed var(--line);border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;background:#faf8f4}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--gold);background:#fff8ec}
.upload-zone .icon{font-size:28px;margin-bottom:6px;color:var(--muted)}
.upload-zone p{font-size:12px;color:var(--muted)}
.upload-zone .done{color:#2d5a27;font-weight:700;font-size:13px}
.upload-preview{max-width:200px;margin-top:12px;border-radius:4px;border:1px solid var(--line)}

/* ── Audit log ───────────────────────────────────────────────────────────── */
.audit-row{display:flex;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start;font-size:13px}
.audit-row:last-child{border-bottom:0}
.audit-row .tag{font-size:9px;font-weight:800;letter-spacing:.1em;padding:3px 8px;border-radius:4px;white-space:nowrap;text-transform:uppercase}
.tag-create{background:#e6f0e3;color:#2d5a27}.tag-update{background:#f7ecd2;color:#7a5f0e}.tag-delete{background:#fde8e8;color:#a22}.tag-upload{background:#e8e4da;color:#5b4a27}.tag-publish{background:#e6f0e3;color:#2d5a27}.tag-publish-toggle{background:#f7ecd2;color:#7a5f0e}
.audit-row .meta{font-size:11px;color:var(--muted);min-width:140px}
.audit-row .detail{color:var(--ink);flex:1}

/* ── Pedigree tree ───────────────────────────────────────────────────────── */
.pedigree-tree{display:flex;flex-direction:column;align-items:center;padding:20px 0}
.tree-gen{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;position:relative}
.tree-node{background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:12px 16px;min-width:120px;text-align:center;cursor:pointer;transition:all .2s;position:relative;z-index:2}
.tree-node:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.tree-node.selected{border-color:var(--gold);background:#fff8ec}
.tree-node .tname{font:600 16px var(--serif);letter-spacing:-.01em}
.tree-node .trole{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.tree-node .tcolour{font-size:11px;color:var(--muted)}
.tree-connector{width:2px;height:20px;background:var(--line);margin:0 auto}
.tree-label{text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:8px 0}
.pedigree-selector{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.pedigree-selector select{border:1px solid var(--line);padding:10px 14px;background:#fff;min-width:200px;outline:none;font-size:14px}
.pedigree-selector select:focus{border-color:var(--gold)}
.no-pedigree-data{text-align:center;padding:60px;color:var(--muted)}

/* ── Content editor ──────────────────────────────────────────────────────── */
.content-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px}
.content-tab{padding:12px 20px;font-size:13px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);letter-spacing:.04em}
.content-tab:hover{color:var(--ink)}
.content-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.content-editor textarea{width:100%;min-height:300px;border:1px solid var(--line);padding:14px 16px;background:#faf8f4;font-family:monospace;font-size:13px;resize:vertical;outline:none;line-height:1.6}
.content-editor textarea:focus{border-color:var(--gold);background:#fff}
.content-saved{color:#2d5a27;font-size:12px;font-weight:700;margin-left:12px}

/* ── Draft badge ─────────────────────────────────────────────────────────── */
.pill.draft{background:#f0ebe0;color:#777;border-color:#d4cfc5}
.pill.published{background:#e6f0e3;border-color:#9dbf9a;color:#2d5a27}

/* ── Payment deep dashboard ─────────────────────────────────────────────── */
.pay-deets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:16px 0}
.pay-deet{background:#faf8f4;border:1px solid var(--line);padding:12px 14px}
.pay-deet .pd-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.pay-deet .pd-val{font:600 15px var(--serif);margin-top:2px;word-break:break-all}
.pay-deet .pd-val a{color:var(--gold)}

/* ── Responsive tweaks ───────────────────────────────────────────────────── */
@media(max-width:700px){
  .pay-deets{grid-template-columns:1fr 1fr}
  .tree-gen{gap:16px}
  .tree-node{min-width:90px;padding:8px 10px}
  .tree-node .tname{font-size:13px}
}
</style>
</head>
<body>

<!-- ══════════════ LOGIN SCREEN ══════════════ -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:48px;height:48px;border:1.5px solid var(--gold);display:inline-grid;place-items:center;font-family:var(--serif);font-size:20px;color:var(--gold);margin-bottom:12px">BG</div>
      <h1>Kennel Admin</h1>
      <p class="sub">BELLISSIMO GENI • NIGERIA</p>
    </div>
    <label>Password</label>
    <input type="password" id="loginPw" placeholder="Enter admin password" autocomplete="current-password">
    <button class="btn-login" id="loginBtn">Sign In</button>
    <p class="login-err" id="loginErr"></p>
  </div>
</div>

<!-- ══════════════ ADMIN DASHBOARD ══════════════ -->
<div class="admin-wrap" id="adminWrap">
  <div class="overlay-bg" id="overlayBg"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="mark">BG</div>
      <b>BELLISSIMO GENI</b>
      <small>CANe CORSO • NIGERIA</small>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Overview</div>
      <div class="nav-item active" data-page="dashboard">Dashboard</div>
      <div class="nav-section">Dogs</div>
      <div class="nav-item" data-page="dogs">All Dogs<span class="count" id="dogCount">0</span></div>
      <div class="nav-item" data-page="add-dog">Add Dog</div>
      <div class="nav-section">Puppies</div>
      <div class="nav-item" data-page="puppies">All Puppies<span class="count" id="pupCount">0</span></div>
      <div class="nav-item" data-page="litters">Litters</div>
      <div class="nav-item" data-page="add-puppy">Add Puppy</div>
      <div class="nav-section">Sales</div>
      <div class="nav-item" data-page="reservations">Reservations<span class="count" id="resCount">0</span></div>
      <div class="nav-section">Content</div>
      <div class="nav-item" data-page="testimonials">Testimonials</div>
      <div class="nav-item" data-page="gallery">Gallery</div>
      <div class="nav-item" data-page="edit-content">Edit Pages</div>
      <div class="nav-section">System</div>
      <div class="nav-item" data-page="pedigree-editor">Pedigree Editor</div>
      <div class="nav-item" data-page="audit">Audit Trail<span class="count" id="auditCount"></span></div>
      <div class="nav-item" data-page="settings">Settings</div>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="logoutBtn">Sign Out</button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-toggle" id="mobileToggle">☰ Menu</button>
        <h2 id="pageTitle">Dashboard</h2>
      </div>
      <div class="topbar-right">
        <span class="topbar-date" id="topDate"></span>
      </div>
    </header>
    <div class="content-scroll" id="contentArea"></div>
  </div>
</div>

<!-- ══════════════ MODAL ══════════════ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<!-- ══════════════ TOAST ══════════════ -->
<div class="toast" id="toast"></div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const API_BASE = window.BG_WEBHOOK_URL || '';
// Store a hash of the password, not the raw value (mitigates XSS credential theft)
function hashStr(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return 'h'+Math.abs(h).toString(36);}
let adminPWHash = localStorage.getItem('bg_admin_pw_hash')||'';
let currentPuppyCatalog = [];
let currentDogs = [];

// ── Auth ────────────────────────────────────────────────────────────────────
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('bg_admin_pw_hash');
  document.getElementById('loginScreen').style.display='';
  document.getElementById('adminWrap').classList.remove('active');
});
async function doLogin() {
  const pw = document.getElementById('loginPw').value;
  if (!pw) return;
  try {
    const r = await fetch(API_BASE + '/admin/api/stats', {
      headers: { 'Authorization': 'Bearer ' + pw }
    });
    const j = await r.json();
    if (j.ok) {
      adminPW = pw;
      localStorage.setItem('bg_admin_pw', pw);
      showAdmin();
    } else {
      document.getElementById('loginErr').textContent = j.error === 'unauthorized' ? 'Incorrect password.' : 'Connection error.';
    }
  } catch(e) {
    document.getElementById('loginErr').textContent = 'Could not reach server.';
  }
}
function showAdmin() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminWrap').classList.add('active');
  document.getElementById('topDate').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'short',day:'numeric'});
  if(adminPW) loadAllData();
}

// ── Navigation ──────────────────────────────────────────────────────────────
const navItems = document.querySelectorAll('.nav-item[data-page]');
navItems.forEach(item => {
  item.addEventListener('click', () => {
    navItems.forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    const page = item.dataset.page;
    document.getElementById('pageTitle').textContent = item.textContent.replace(/\d+/,'').trim() || page;
    closeMobile();
    renderPage(page);
  });
});

const mobileToggle = document.getElementById('mobileToggle');
const sidebar = document.getElementById('sidebar');
const overlayBg = document.getElementById('overlayBg');
mobileToggle.addEventListener('click', () => { sidebar.classList.toggle('open'); overlayBg.classList.toggle('open'); });
overlayBg.addEventListener('click', closeMobile);
function closeMobile() { sidebar.classList.remove('open'); overlayBg.classList.remove('open'); }

// ── HTTP helpers ────────────────────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers||{}) };
  if (adminPW) headers['Authorization'] = 'Bearer ' + adminPW;
  const r = await fetch(API_BASE + path, { ...opts, headers });
  return r.json();
}

async function loadAllData() {
  const [dogsRes, pupsRes, resRes] = await Promise.all([
    apiFetch('/admin/api/dogs'),
    apiFetch('/admin/api/puppies'),
    apiFetch('/admin/api/reservations')
  ]);
  currentDogs = dogsRes.data || [];
  const pups = pupsRes.data || [];
  currentPuppyCatalog = pups.map(p => p.id);
  document.getElementById('dogCount').textContent = currentDogs.length;
  document.getElementById('pupCount').textContent = pups.length;
  document.getElementById('resCount').textContent = (resRes.data||[]).length;
  renderPage('dashboard');
}

// ── Page router ─────────────────────────────────────────────────────────────
async function renderPage(page) {
  const area = document.getElementById('contentArea');
  area.innerHTML = '<p class="muted" style="padding:40px;text-align:center">Loading…</p>';
  switch(page) {
    case 'dashboard':   area.innerHTML = await renderDashboard(); break;
    case 'dogs':        area.innerHTML = await renderDogsList(); break;
    case 'add-dog':     area.innerHTML = await renderDogForm(null); break;
    case 'puppies':     area.innerHTML = await renderPuppiesList(); break;
    case 'litters':     area.innerHTML = await renderLittersList(); break;

async function checkCircular(selectEl, otherName, selfId) {
  const form = document.getElementById('dogForm');
  const otherSel = form.querySelector('[name="'+otherName+'"]');
  if (!selectEl.value || !otherSel?.value) { document.getElementById('circularWarn').style.display='none'; return; }
  // Check if sireId === damId
  if (selectEl.value === otherSel.value) {
    document.getElementById('circularWarn').textContent = '⚠ Sire and Dam cannot be the same dog.';
    document.getElementById('circularWarn').style.display = 'block';
    selectEl.value = '';
    return;
  }
  // Check if selected sire is the dog itself (editing existing)
  if (selfId && selectEl.value === selfId && otherSel.value === selfId) {
    document.getElementById('circularWarn').textContent = '⚠ Circular reference: a dog cannot be its own parent.';
    document.getElementById('circularWarn').style.display = 'block';
    selectEl.value = '';
    return;
  }
  document.getElementById('circularWarn').style.display = 'none';
}
async function handleUploadFile(input, urlInputId) {
  const file = input.files[0];
  if (!file) return;
  const zone = input.closest('.field')?.querySelector('.upload-zone') || input.previousElementSibling;
  const preview = zone?.querySelector('img.upload-preview');
  if (preview) { preview.style.display='block'; preview.src = URL.createObjectURL(file); }
  const reader = new FileReader();
  reader.onload = () => {
    if (zone) zone.innerHTML = `<div class="icon" style="color:#2d5a27">✓</div><p class="done">${esc(file.name)}</p><img class="upload-preview" src="${reader.result}" style="display:block">`;
  };
  reader.readAsDataURL(file);
  // Actually upload to R2
  const formData = new FormData();
  formData.append('file', file);
  const zoneEl = input.closest('.field')?.querySelector('.upload-zone');
  if (zoneEl) { zoneEl.querySelector('p')?.remove(); const loading = document.createElement('p'); loading.className='muted'; loading.textContent='Uploading...'; zoneEl.appendChild(loading); }
  try {
    const r = await fetch(API_BASE + '/admin/api/upload', {
      method: 'POST', body: formData,
      headers: { 'Authorization': 'Bearer ' + adminPW }
    });
    const j = await r.json();
    if (j.ok) {
      document.getElementById(urlInputId).value = j.publicUrl || j.url;
      if (zoneEl) { zoneEl.querySelector('p')?.remove(); zoneEl.innerHTML='<div class="icon" style="color:#2d5a27">✓</div><p class="done">Photo uploaded</p>'; }
      toast('Photo uploaded');
    } else throw new Error(j.error);
  } catch(e) {
    if (zoneEl) { zoneEl.querySelector('p')?.remove(); zoneEl.innerHTML='<div class="icon" style="color:#b33">✕</div><p>'+e.message+'</p>'; }
    toast('Upload failed: '+e.message, 'err');
  }
}
async function saveDog(e, id) {
  e.preventDefault();
  const f = e.target;
  const body = {};
  ['name','sex','colour','dateOfBirth','sireId','damId','registration','status','photo','bio','health','achievements','publishStatus'].forEach(k => {
    if(f[k]?.value !== undefined) body[k] = f[k].value.trim();

  if(j.ok) { toast(id?'Dog updated':'Dog created'); closeModal(); loadAllData(); }
  else toast(j.error||'Failed','err');
}

  const j = await apiFetch('/admin/api/litters');
  const litters = j.data || [];
  const rows = litters.map(l => {
    const sire = currentDogs.find(d=>d.id===l.sireId);
    const dam = currentDogs.find(d=>d.id===l.damId);
    const pups = (currentPups||[]).filter(p=>p.litterId===l.id);
    return `<tr>
      <td class="name">${esc(l.name||l.id)}</td>
      <td class="muted">${sire?sire.name:'—'} × ${dam?dam.name:'—'}</td>
      <td class="muted">${l.whelpDate||'—'}</td>
      <td><span class="pill ${(l.status||'coming-soon').toLowerCase().replace(/ /g,'-')}">${l.status||'COMING SOON'}</span></td>
      <td class="muted">${pups.length} puppy${pups.length!==1?'s':''}</td>
      <td><div class="btn-group"><button class="btn btn-sm btn-ghost" onclick="editLitter('${l.id}')">Edit</button><button class="btn btn-sm btn-del" onclick="deleteLitter('${l.id}','${esc(l.name||l.id)}')">Delete</button></div></td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" class="muted" style="text-align:center;padding:40px">No litters registered</td></tr>';
  return `
    <div class="toolbar"><button class="btn btn-gold" onclick="editLitter(null)">+ New Litter</button></div>
    <div class="panel"><div class="panel-body" style="padding:0;overflow-x:auto">
      <table class="datatable"><thead><tr><th>Name</th><th>Sire × Dam</th><th>Whelp Date</th><th>Status</th><th>Puppies</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>
    </div></div>`;
}
window.editLitter = async function(id) {
  let litter = null;
  if(id) {
    const j = await apiFetch('/admin/api/litters?id='+id);
    if(!j.ok){toast('Litter not found','err');return;}
    litter = j.data;
  }
  const dogOpts = (currentDogs||[]).map(d=>`<option value="${d.id}" ${litter&&litter.sireId===d.id?'selected':''}>${esc(d.name)}</option>`).join('');
  const modalHtml = `
    <div class="panel" style="margin:0">
      <div class="panel-header"><h3>${id?'Edit Litter':'New Litter'}</h3></div>
      <div class="panel-body">
        <form onsubmit="saveLitter(event,'${id||''}')">
          <div class="form-grid">
            <div class="field full"><label>Litter Name *</label><input name="name" required value="${esc(litter?.name||'')}"></div>
            <div class="field"><label>Sire</label><select name="sireId"><option value="">None</option>${dogOpts}</select></div>
            <div class="field"><label>Dam</label><select name="damId"><option value="">None</option>${dogOpts}</select></div>
            <div class="field"><label>Whelp Date</label><input type="date" name="whelpDate" value="${litter?.whelpDate||''}"></div>
            <div class="field"><label>Status</label><select name="status"><option value="COMING SOON" ${litter?.status==='COMING SOON'?'selected':''}>Coming Soon</option><option value="ACTIVE" ${litter?.status==='ACTIVE'?'selected':''}>Active</option><option value="CLOSED" ${litter?.status==='CLOSED'?'selected':''}>Closed</option></select></div>
            <div class="field full"><label>Notes</label><textarea name="notes" rows="2">${esc(litter?.notes||'')}</textarea></div>
          </div>
          <div style="margin-top:16px"><button type="submit" class="btn btn-gold">${id?'Save Changes':'Create Litter'}</button></div>
        </form>
      </div>
    </div>`;
  openModal(id?'Edit Litter':'New Litter', modalHtml);
};
async function saveLitter(e, id) {
  e.preventDefault();
  const f = e.target;
  const body = {};
  ['name','sireId','damId','whelpDate','status','notes'].forEach(k => {
    if(f[k]?.value !== undefined) body[k] = f[k].value.trim();
  });
  const url = id ? '/admin/api/litters?id='+encodeURIComponent(id) : '/admin/api/litters';
  const j = await apiFetch(url, { method:'POST', body: JSON.stringify(body) });
  if(j.ok) { toast(id?'Litter updated':'Litter created'); closeModal(); refreshPuppies(); }
  else toast(j.error||'Failed','err');
}
window.deleteLitter = async function(id, name) {
  if(!confirm('Delete litter '+name+'?'))return;
  await apiFetch('/admin/api/litters?id='+encodeURIComponent(id),{method:'DELETE'});
  toast('Litter deleted'); refreshPuppies();
};

  document.getElementById('modalOverlay').classList.remove('open');
};
document.getElementById('modalOverlay').addEventListener('click', e => {
  if(e.target === document.getElementById('modalOverlay')) closeModal();
});

// ── Toast ───────────────────────────────────────────────────────────────────
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type==='err'?' err':'');
  setTimeout(()=> t.className = 'toast', 3000);
}

// ── Escaper ─────────────────────────────────────────────────────────────────
function sanitizeHTML(html) {
    // Strip dangerous tags and attributes — preserves safe HTML for the content editor
    return String(html || '')
      .replace(/<script[^>]*>[sS]*?<\/script>/gi, '')
      .replace(/on\w+\s*=/gi, '')
      .replace(/<iframe[^>]*>[sS]*?<\/iframe>/gi, '')
      .replace(/<form[^>]*>[sS]*?<\/form>/gi, '')
      .replace(/javascript:/gi, '')
      .replace(/<object[^>]*>[sS]*?<\/object>/gi, '')
      .replace(/<embed[^>]*[\/>]/gi, '');
  }

function esc(s) {
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function renderEditContent() {
  const PAGES = ['about','breeding','standards','socialization','social','contact'];
  const results = await Promise.all(PAGES.map(p => apiFetch('/admin/api/content?page='+encodeURIComponent(p)).then(r=>({page:p,data:r.data||{html:''}}))));
  const tabs = PAGES.map((p,i) => '<div class="content-tab'+(i===0?' active':'')+'" onclick="switchContentTab('+JSON.stringify(p)+',this)">'+p.charAt(0).toUpperCase()+p.slice(1)+'</div>').join('');
  const editors = PAGES.map(p => '<div class="content-editor" id="editor-'+p+'" style="display:'+(p===PAGES[0]?'block':'none')+'"><textarea name="html" rows="20" placeholder="Paste approved HTML content here..."></textarea><div style="margin-top:12px" class="btn-group"><button class="btn btn-gold" onclick="saveContent('+JSON.stringify(p)+')">Save Content</button><span class="muted" style="font-size:11px;margin-left:8px">Saves to KV - goes live immediately</span></div></div>').join('');
  return '<div class="panel"><div class="panel-header"><h3>Edit Website Pages</h3></div><div class="panel-body"><p class="muted" style="margin-bottom:16px">These pages are currently static HTML. Edit the HTML below to update live content without touching code.</p><div class="content-tabs">'+tabs+'</div>'+editors+'</div></div>';
}
window.switchContentTab = function(page, el) {
  document.querySelectorAll('.content-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.content-editor').forEach(e=>e.style.display='none');
  el.classList.add('active');
  document.getElementById('editor-'+page).style.display='block';
};
async function saveContent(page) {
  const ta = document.querySelector('#editor-'+page+' textarea');
  if(!ta) return;
  const cleanHtml = sanitizeHTML(ta.value); const j = await apiFetch('/admin/api/content?page='+encodeURIComponent(page),{method:'POST',body:JSON.stringify({html:cleanHtml})});
  if(j.ok) toast('Page saved'); else toast(j.error||'Failed','err');
}

// -- Audit Trail --
async function renderAuditTrail() {
  const j = await apiFetch('/admin/api/audit?limit=200');
  const logs = j.data || [];
  const tagCls = {create:'tag-create',update:'tag-update',delete:'tag-delete',upload:'tag-upload',publish_toggle:'tag-publish-toggle',publish:'tag-publish'};
  const rows = logs.map(l => {
    const cls = tagCls[l.action]||'tag-update';
    const detail = l.details && Object.keys(l.details).length ? Object.entries(l.details).map(([k,v])=>k+': '+esc(String(v))).join(', ') : '';
    return '<div class="audit-row"><span class="tag '+cls+'">'+l.action+'</span><span class="meta">'+new Date(l.at).toLocaleString()+' | '+esc(l.entity)+'</span><span class="detail">'+esc(l.entityId||'')+' '+detail+'</span></div>';
  }).join('') || '<p class="muted" style="padding:30px;text-align:center">No audit entries yet.</p>';
  return '<div class="panel"><div class="panel-header"><h3>Audit Trail <span class="muted" style="font-weight:400;font-size:12px">('+logs.length+' entries)</span></h3></div><div class="panel-body" style="padding:0">'+rows+'</div></div>';
}

// -- Pedigree Visual Editor --
async function renderPedigreeEditor() {
  const j = await apiFetch('/admin/api/dogs');
  const dogs = j.data || [];
  const opts = dogs.map(d => '<option value="'+d.id+'">'+esc(d.name)+' ('+d.sex+')</option>').join('');
  return '<div class="panel"><div class="panel-header"><h3>Pedigree Tree Builder</h3><span class="muted" style="font-size:11px">Select a dog to view and edit its ancestry</span></div><div class="panel-body"><div class="pedigree-selector"><select id="pedDogSelect" onchange="renderPedigreeTree(this.value)"><option value="">-- Select a dog --</option>'+opts+'</select></div><div id="pedigreeTreeArea" class="pedigree-tree"><div class="no-pedigree-data"><p style="font-size:32px;margin-bottom:12px">G</p><p>Select a dog above to build and preview its family tree</p></div></div></div></div>';
}
window.renderPedigreeTree = async function(dogId) {
  if(!dogId) { document.getElementById('pedigreeTreeArea').innerHTML='<div class="no-pedigree-data"><p style="font-size:32px;margin-bottom:12px">G</p><p>Select a dog above</p></div>'; return; }
  const dj = await apiFetch('/admin/api/dogs?id='+encodeURIComponent(dogId));
  if(!dj.ok) return;
  const dog = dj.data;
  const j = await apiFetch('/admin/api/dogs');
  const dogs = j.data || [];
  const dogOpts = dogs.map(d => '<option value="'+d.id+'" '+(dog.sireId===d.id?'selected':'')+'> '+esc(d.name)+'</option>').join('');
  const damOpts = dogs.map(d => '<option value="'+d.id+'" '+(dog.damId===d.id?'selected':'')+'> '+esc(d.name)+'</option>').join('');
  function buildNode(id, gen) {
    if(!id||gen>3) return '<div class="tree-node"><div class="trole">?</div><div class="tname">Not recorded</div></div>';
    const d = dogs.find(x=>x.id===id);
    if(!d) return '<div class="tree-node"><div class="trole">?</div><div class="tname">Unknown</div></div>';
    return '<div class="tree-gen"><div class="tree-node'+(id===dogId?' selected':'')+'"><div class="trole">GEN '+gen+'</div><div class="tname">'+esc(d.name)+'</div><div class="tcolour">'+esc(d.colour||'')+'</div></div></div>';
  }
  const sirGen = buildNode(dog.sireId,1);
  const damGen = buildNode(dog.damId,1);
  const html = '<div style="margin-bottom:20px;padding:16px;background:#faf8f4;border-radius:6px"><strong style="font:600 20px var(--serif)">'+esc(dog.name)+'</strong><span class="muted" style="margin-left:12px">'+esc(dog.sex||'')+' | '+esc(dog.colour||'')+'</span><div style="margin-top:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><span class="muted" style="font-size:12px">Sire:</span><select id="pedSire" style="border:1px solid var(--line);padding:8px 12px;background:#fff"><option value="">None</option>'+dogOpts+'</select><span class="muted" style="font-size:12px">Dam:</span><select id="pedDam" style="border:1px solid var(--line);padding:8px 12px;background:#fff"><option value="">None</option>'+damOpts+'</select><button class="btn btn-sm btn-gold" onclick="savePedigree('+JSON.stringify(dog.id)+')">Save Parent Links</button></div></div>'+sirGen+damGen;
  document.getElementById('pedigreeTreeArea').innerHTML = html;
};
async function savePedigree(dogId) {
  const sireId = document.getElementById('pedSire').value||null;
  const damId = document.getElementById('pedDam').value||null;
  const j = await apiFetch('/admin/api/dogs?id='+encodeURIComponent(dogId),{method:'POST',body:JSON.stringify({sireId,damId})});
  if(j.ok){toast('Pedigree updated');renderPedigreeTree(dogId);loadAllData();}else{toast(j.error||'Failed','err');}
}

  const storedPw = localStorage.getItem('bg_admin_pw');
  if(storedPw) {
    adminPW = storedPw;
    showAdmin();
  }
})();
