name: Deploy Bellissimo Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.BELLISSIMO_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "Missing BELLISSIMO_ADMIN_PASSWORD"; exit 1; }

      - name: Install Worker dependencies
        working-directory: webhook
        run: npm install

      - name: Test Worker
        working-directory: webhook
        run: |
          npm test
          npm run check

      - name: Deploy and auto-provision KV/R2
        working-directory: webhook
        run: |
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson"
          npx wrangler deploy
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          npx wrangler deploy
          {
            echo "## Bellissimo Worker deployed"
            echo
            echo "Wrangler automatically provisions the ADMIN and RESERVATIONS KV namespaces and UPLOADS R2 bucket."
            echo "Copy the workers.dev URL printed in the deployment log into the Backend URL field on admin.html."
          } >> "$GITHUB_STEP_SUMMARY"
