name: Test Bellissimo Worker

on:
  pull_request:
    paths:
      - "webhook/**"
      - "assets/admin-visits.*"
      - "assets/site-analytics.js"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/worker-test.yml"
  push:
    branches:
      - main
    paths:
      - "webhook/**"
      - "assets/admin-visits.*"
      - "assets/site-analytics.js"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/worker-test.yml"

permissions:
  contents: read

jobs:
  worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
