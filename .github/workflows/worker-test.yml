name: Test Bellissimo Worker

on:
  pull_request:
    paths:
      - "webhook/**"
      - ".github/workflows/worker-test.yml"
  push:
    branches:
      - main
    paths:
      - "webhook/**"
      - ".github/workflows/worker-test.yml"

permissions:
  contents: read

jobs:
  worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: webhook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run check
      - run: npm test
