name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Pages status (diagnostic)
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking Pages configuration for $GITHUB_REPO"
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/$GITHUB_REPO/pages || true

      - name: Prepare publish directory
        run: |
          set -e
          # Reconstruct the exact verified second-dog WebP from text-safe chunks.
          # This avoids binary transport corruption while preserving the user's real photo.
          cat .github/assets/dog2.b64.part1 \
              .github/assets/dog2.b64.part2 \
              .github/assets/dog2.b64.part3 \
              .github/assets/dog2.b64.part4 \
            | tr -d '\n\r' | base64 --decode > assets/dogs/bellissimo-dog-02-hd.webp
          test "$(wc -c < assets/dogs/bellissimo-dog-02-hd.webp)" -eq 21418
          test "$(git hash-object assets/dogs/bellissimo-dog-02-hd.webp)" = "972a8c75f289fbeb1c26d557b70c146191004666"
          file assets/dogs/bellissimo-dog-02-hd.webp
          rm -rf build
          mkdir -p build
          tar -C . \
            --exclude='./build' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./webhook' \
            -cf - . | tar -C build -xf -
          echo "Publishing $(ls build | wc -l) top-level entries (excludes .git/.github/webhook)"

      - name: Determine publish directory
        id: find_dir
        run: |
          set -e
          for d in build public dist docs; do
            if [ -d "$d" ]; then
              echo "Found directory $d"
              echo "publish_dir=$d" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "publish_dir=." >> $GITHUB_OUTPUT

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_dir.outputs.publish_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4