name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Pages status (diagnostic)
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking Pages configuration for $GITHUB_REPO"
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/$GITHUB_REPO/pages || true

      - name: Prepare publish directory
        run: |
          set -e
          test -f assets/dogs/bellissimo-dog-02-hd.webp
          file assets/dogs/bellissimo-dog-02-hd.webp

          # Reconstruct the two uploaded family photos from text-safe chunks.
          cat .github/assets/family-dog1.b64.part* | tr -d '\n\r' | base64 --decode > assets/dogs/bellissimo-family-dog-01.webp
          cat .github/assets/family-dog2.b64.part* | tr -d '\n\r' | base64 --decode > assets/dogs/bellissimo-family-dog-02.webp
          test -s assets/dogs/bellissimo-family-dog-01.webp
          test -s assets/dogs/bellissimo-family-dog-02.webp
          file assets/dogs/bellissimo-family-dog-01.webp
          file assets/dogs/bellissimo-family-dog-02.webp

          # Reconstruct the newly uploaded featured black Corso photo.
          cat .github/assets/featured-black-corso.b64.part* | tr -d '\n\r' | base64 --decode > assets/dogs/bellissimo-featured-black-corso.webp
          test -s assets/dogs/bellissimo-featured-black-corso.webp
          file assets/dogs/bellissimo-featured-black-corso.webp

          # Reconstruct the uploaded puppy photo used in the Puppies card.
          cat .github/assets/puppy-section.b64.part* | tr -d '\n\r' | base64 --decode > assets/dogs/bellissimo-puppy-section.webp
          test -s assets/dogs/bellissimo-puppy-section.webp
          file assets/dogs/bellissimo-puppy-section.webp

          rm -rf build
          mkdir -p build
          tar -C . \
            --exclude='./build' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./webhook' \
            -cf - . | tar -C build -xf -
          echo "Publishing $(ls build | wc -l) top-level entries (excludes .git/.github/webhook)"

      - name: Determine publish directory
        id: find_dir
        run: |
          set -e
          for d in build public dist docs; do
            if [ -d "$d" ]; then
              echo "Found directory $d"
              echo "publish_dir=$d" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "publish_dir=." >> $GITHUB_OUTPUT

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_dir.outputs.publish_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4