name: Website Screenshots

on:
  pull_request:
    paths:
      - ".github/workflows/screenshots.yml"
      - "index.html"
      - "home-restored.css"
      - "dogs.html"
      - "pedigree.html"
      - "data/dogs.json"
      - "site.js"
      - "site.css"
      - "social.html"
      - "contact.html"
      - "about.html"
      - "gallery.html"
      - "puppies.html"
      - "reserve.html"
      - "breeding.html"
      - "socialization.html"
      - "standards.html"
      - "testimonials.html"
      - "data/puppies.json"
      - "assets/**"
      - "admin.html"
      - "webhook/**"
      - "CNAME"
      - "robots.txt"
      - "sitemap.xml"
      - "scripts/set-production-domain.mjs"
      - ".github/workflows/activate-domain.yml"
      - ".github/workflows/deploy-worker.yml"
      - "site-config.json"
  workflow_run:
    workflows: ["GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Reconstruct remaining encoded site photos
        run: |
          mkdir -p assets/dogs
          cat .github/assets/featured-black-corso.b64.part* | tr -d '\n\r' | base64 --decode > assets/dogs/bellissimo-featured-black-corso.webp
          cat .github/assets/puppy-section.b64.part* | tr -d '\n\r' | base64 --decode > assets/dogs/bellissimo-puppy-section.webp
          test -s assets/dogs/bellissimo-featured-black-corso.webp
          test -s assets/dogs/bellissimo-puppy-section.webp
          cat .github/assets/diesel-bellissimo-geni-avif.b64.part* | tr -d '\n\r' | base64 --decode > assets/dogs/diesel-bellissimo-geni.avif
          cat .github/assets/rocco-bellissimo-geni-avif.b64.part* | tr -d '\n\r' | base64 --decode > assets/dogs/rocco-bellissimo-geni.avif
          test -s assets/dogs/diesel-bellissimo-geni.avif
          test -s assets/dogs/rocco-bellissimo-geni.avif

      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Regression-test remaining production gaps
        run: |
          node <<'EOF'
          const fs = require('fs');
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };

          const admin = fs.readFileSync('admin.html', 'utf8');
          assert(/name="owner"/.test(admin), 'Admin dog editor must expose an owner field');
          assert(/\['name','sex','colour','dateOfBirth','sireId','damId','registration','owner','status'/.test(admin), 'Dog save payload must persist owner');

          const wrangler = fs.readFileSync('webhook/wrangler.toml', 'utf8');
          assert(!/\bid\s*=\s*""/.test(wrangler), 'Wrangler config must not contain blank KV IDs');
          assert(!/\bbucket_name\s*=\s*""/.test(wrangler), 'Wrangler config must not contain a blank R2 bucket name');
          assert(/\[\[kv_namespaces\]\][\s\S]*binding\s*=\s*"RESERVATIONS"/.test(wrangler), 'RESERVATIONS auto-provision binding missing');
          assert(/\[\[kv_namespaces\]\][\s\S]*binding\s*=\s*"ADMIN"/.test(wrangler), 'ADMIN auto-provision binding missing');
          assert(/\[\[r2_buckets\]\][\s\S]*binding\s*=\s*"UPLOADS"/.test(wrangler), 'UPLOADS auto-provision binding missing');

          const pkg = JSON.parse(fs.readFileSync('webhook/package.json', 'utf8'));
          assert(pkg.devDependencies && pkg.devDependencies.wrangler, 'Wrangler must be pinned for automatic provisioning');

          const site = fs.readFileSync('site.js', 'utf8');
          for (const label of ['Home','Our Dogs','Puppies','Pedigree','Breeding','Gallery','About','Social','Export','Reserve','Contact']) {
            assert(site.includes('>' + label + '<'), 'Canonical mobile menu missing ' + label);
          }
          assert(site.includes('function resolveApiBase()'), 'Public site must resolve its deployed CMS backend');
          assert(site.includes("fetch('site-config.json'"), 'Public site must load site-config.json before falling back to static JSON');
          const siteConfig = JSON.parse(fs.readFileSync('site-config.json', 'utf8'));
          assert(typeof siteConfig.backendUrl === 'string', 'site-config.json must expose backendUrl');
          assert(!siteConfig.backendUrl || /^https:\/\//.test(siteConfig.backendUrl), 'Configured backend URL must be HTTPS');
          assert(admin.includes("fetch('site-config.json'"), 'Admin login must auto-discover the deployed Worker URL');
          const domainWorkflow = fs.readFileSync('.github/workflows/activate-domain.yml', 'utf8');
          assert(domainWorkflow.includes('PAGES_ADMIN_TOKEN'), 'Custom-domain activation must require a Pages admin token');
          assert(domainWorkflow.includes('gh api --method PUT') && domainWorkflow.includes('repos/$GITHUB_REPOSITORY/pages'), 'Custom-domain activation must configure GitHub Pages via API');
          assert(domainWorkflow.includes('185.199.108.153'), 'Custom-domain activation must verify GitHub Pages DNS targets');

          const reserve = fs.readFileSync('reserve.html', 'utf8');
          assert(site.includes('resolveApiBase: resolveApiBase'), 'Shared site helper must expose backend resolution to interactive flows');
          assert(reserve.includes('BG.resolveApiBase()'), 'Reservation webhook must resolve the deployed backend at submission time');
          assert(site.includes('function hydrateManagedContent()'), 'Managed static pages must consume saved CMS content');
          assert(site.includes("'/api/content?page='"), 'Managed content must load from the public Worker content endpoint');
          assert(site.includes("['about','breeding','standards','socialization','social']"), 'Only script-safe content pages may be live-replaced');
          assert(admin.includes("const PAGES = ['about','breeding','standards','socialization','social'];"), 'Admin content editor must match the live-managed page set');
          assert(admin.includes("fetch(p+'.html'"), 'Empty CMS records must fall back to the current static page content for editing');
          EOF

      - name: Run Worker unit tests
        run: |
          node --test webhook/test.js
          node --check webhook/handler.js

      - name: Choose screenshot target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bellissimo-http.log 2>&1 &
            echo "BASE_URL=http://127.0.0.1:4173/" >> "$GITHUB_ENV"
          else
            echo "BASE_URL=https://eghosa001.github.io/bellissimo-geni-cane-corso/" >> "$GITHUB_ENV"
          fi

      - name: Capture homepage screenshots
        run: |
          mkdir -p screenshots
          node <<'EOF'
          const { chromium, devices } = require('playwright');

          async function prepareHero(page, label) {
            await page.waitForLoadState('networkidle');
            await page.waitForTimeout(500);

            const heroImage = page.locator('.legacy-hero-photo > img');
            await heroImage.waitFor({ state: 'visible' });

            const imageState = await heroImage.evaluate(img => ({
              complete: img.complete,
              naturalWidth: img.naturalWidth,
              naturalHeight: img.naturalHeight
            }));
            if (!imageState.complete || imageState.naturalWidth === 0 || imageState.naturalHeight === 0) {
              throw new Error(label + ' hero image failed to load');
            }
          }

          (async () => {
            const baseUrl = process.env.BASE_URL;
            const browser = await chromium.launch({ headless: true });

            const desktop = await browser.newPage({
              viewport: { width: 1440, height: 1100 },
              deviceScaleFactor: 1
            });
            await desktop.goto(baseUrl + '?screenshot=desktop-' + Date.now(), {
              waitUntil: 'networkidle',
              timeout: 60000
            });
            await prepareHero(desktop, 'desktop homepage');
            await desktop.screenshot({
              path: 'screenshots/top-desktop.png',
              fullPage: false
            });

            const mobileContext = await browser.newContext({
              ...devices['Pixel 7']
            });
            const mobile = await mobileContext.newPage();
            await mobile.goto(baseUrl + '?screenshot=mobile-' + Date.now(), {
              waitUntil: 'networkidle',
              timeout: 60000
            });
            await prepareHero(mobile, 'mobile homepage');
            const [dogsBox, puppiesBox, menuBox] = await Promise.all([
              mobile.locator('.reference-quick-nav a[href="dogs.html"]').boundingBox(),
              mobile.locator('.reference-quick-nav a[href="puppies.html"]').boundingBox(),
              mobile.locator('.reference-menu-button').boundingBox()
            ]);
            if (!dogsBox || !puppiesBox || !menuBox || !(dogsBox.x < puppiesBox.x && puppiesBox.x < menuBox.x)) {
              throw new Error('Mobile shortcut order must be Our Dogs, Puppies, Menu');
            }

            const brandBox = await mobile.locator('.reference-brand').boundingBox();
            if (!brandBox || brandBox.x > 24) {
              throw new Error('Mobile homepage logo must be left-aligned');
            }
            const mobileLead = await mobile.locator('.legacy-lead').innerText();
            if (mobileLead.includes('—') || !mobileLead.includes('Cane Corso.\nA premium kennel')) {
              throw new Error('Mobile hero lead punctuation/line break regressed');
            }

            const layout = await mobile.evaluate(() => {
              const buttons = [...document.querySelectorAll('.legacy-actions .legacy-button')]
                .map(el => el.getBoundingClientRect());
              const facts = [...document.querySelectorAll('.reference-credibility article')]
                .map(el => el.getBoundingClientRect());
              return {
                overflow: document.documentElement.scrollWidth - window.innerWidth,
                buttonsStacked: buttons.length === 2 &&
                  Math.abs(buttons[0].x - buttons[1].x) < 2 &&
                  buttons[1].y > buttons[0].y,
                factsOneRow: facts.length === 4 &&
                  Math.max(...facts.map(r => r.y)) - Math.min(...facts.map(r => r.y)) < 2
              };
            });
            if (layout.overflow > 1) throw new Error('Mobile homepage has horizontal overflow');
            if (!layout.buttonsStacked) throw new Error('Hero CTAs must be stacked on mobile');
            if (!layout.factsOneRow) throw new Error('Credibility strip must remain four columns on mobile');

            await mobile.setViewportSize({ width: 360, height: 800 });
            await mobile.waitForTimeout(100);
            const narrowOverflow = await mobile.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            if (narrowOverflow > 1) throw new Error('Homepage overflows at 360px width');

            await mobile.screenshot({
              path: 'screenshots/top-mobile.png',
              fullPage: false
            });

            await mobileContext.close();
            await browser.close();
          })();
          EOF

      - name: Smoke-test dogs and pedigree
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const base = process.env.BASE_URL;

            await page.goto(base + 'dogs.html?dog=branco-custodi-nos', { waitUntil: 'networkidle' });
            await page.locator('#profile h2').filter({ hasText: 'Branco Custodi Nos' }).waitFor();
            const dogImage = page.locator('.profile-media-main img');
            if (!(await dogImage.evaluate(img => img.complete && img.naturalWidth > 0))) throw new Error('Branco profile image failed');
            const profileFit = await dogImage.evaluate(img => getComputedStyle(img).objectFit);
            if (profileFit !== 'contain') throw new Error('Dog profile photography must not crop the subject');
            const cardImages = page.locator('.dog-card-media img');
            for (let i = 0; i < await cardImages.count(); i++) {
              const img = cardImages.nth(i);
              const state = await img.evaluate(el => {
                const canvas = document.createElement('canvas');
                canvas.width = 32; canvas.height = 32;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(el,0,0,32,32);
                const data = ctx.getImageData(0,0,32,32).data;
                let min=255,max=0;
                for(let p=0;p<data.length;p+=4){
                  const y=(data[p]+data[p+1]+data[p+2])/3;
                  min=Math.min(min,y); max=Math.max(max,y);
                }
                return {
                  loaded: el.complete && el.naturalWidth > 0,
                  fit: getComputedStyle(el).objectFit,
                  variance: max-min
                };
              });
              if (!state.loaded) throw new Error('Dog card image ' + i + ' failed to load');
              if (state.fit !== 'cover') throw new Error('Dog card image ' + i + ' is not filling its media frame');
              if (state.variance < 18) throw new Error('Dog card image ' + i + ' rendered as a flat/blank frame');
            }
            const dogText = await page.locator('#profile').innerText();
            if (!dogText.includes('Dragoslav Custodi Nos') || !dogText.includes('Himera Custodi Nos')) throw new Error('Branco parent links missing');
            if (!dogText.includes('OWNER') || !dogText.includes('Kelvin Omigie/BELLISSIMO GENI') || dogText.includes('STATUS')) throw new Error('Current-dog owner row is incorrect');

            await page.goto(base + 'dogs.html?dog=dragoslav-custodi-nos', { waitUntil: 'networkidle' });
            const dragoslavText = await page.locator('#profile').innerText();
            if (!dragoslavText.includes('STATUS') || !dragoslavText.includes('Pedigree ancestor')) throw new Error('Ancestor status should remain visible');
            const dragoslavImage = page.locator('#profile .profile-media-main img');
            if (!(await dragoslavImage.evaluate(img => img.complete && img.naturalWidth > 0))) throw new Error('Supplied Dragoslav photo failed to load');
            if ((await dragoslavImage.evaluate(img => getComputedStyle(img).objectFit)) !== 'contain') throw new Error('Dragoslav photo may crop the dog');
            const dragoslavParents = page.locator('#profile dd a');
            if (await dragoslavParents.count() < 2) throw new Error('Dragoslav sire/dam links are not traceable');

            await page.goto(base + 'pedigree.html?dog=gyda-bellissimo-geni', { waitUntil: 'networkidle' });
            const pedigree = await page.locator('main').innerText();
            for (const expected of ['Gyda Bellissimo Geni','Branco Custodi Nos','Anthie Custodi Nos']) {
              if (!pedigree.includes(expected)) throw new Error('Pedigree missing ' + expected);
            }
            if (pedigree.includes('Henry')) throw new Error('Demo pedigree data still visible');

            await page.goto(base + 'pedigree.html?dog=tessa-sangue-magnifica', { waitUntil: 'networkidle' });
            const tessaPedigree = await page.locator('main').innerText();
            for (const expected of ['Tessa Sangue Magnifica','ZZ Top Sangue Magnifica','Birba Sangue Magnifica','Mockingjay Custodi Nos Sangue Magnifica','Jaro Ivoni Imperial','Sangue Magnifica Murano']) {
              if (!tessaPedigree.includes(expected)) throw new Error('Tessa pedigree missing ' + expected);
            }
            const muranoCards = page.locator('#pedigree-shell .parent-card strong').filter({ hasText: 'Sangue Magnifica Murano' });
            if (await muranoCards.count() !== 2) {
              throw new Error('Repeated pedigree ancestor Sangue Magnifica Murano must remain visible in both verified branches');
            }
            if (await page.locator('#pedigree-shell .generation-block').count() !== 4) {
              throw new Error('Tessa supplied pedigree should stop after its four verified ancestor generations');
            }
            if (/microchip|tattoo/i.test(tessaPedigree.replace(/Microchip numbers and private owner details are not displayed publicly\./i,''))) {
              throw new Error('Private pedigree identifiers must not be exposed');
            }

            for (const expected of ['SIRE OF ZZ Top Sangue Magnifica','DAM OF ZZ Top Sangue Magnifica','SIRE OF Birba Sangue Magnifica','DAM OF Birba Sangue Magnifica']) {
              if (!tessaPedigree.includes(expected)) throw new Error('Pedigree relationship label missing ' + expected);
            }

            await page.goto(base + 'dogs.html?dog=limoncello-sangue-magnifica-custodi-nos', { waitUntil: 'networkidle' });
            await page.locator('#profile h2').filter({ hasText: 'Limoncello Sangue Magnifica Custodi Nos' }).waitFor();
            const limoncelloText = await page.locator('#profile').innerText();
            const limoncelloUpper = limoncelloText.toUpperCase();
            if (!limoncelloText.includes('Limoncello Sangue Magnifica Custodi Nos') || !limoncelloUpper.includes('SIRE OF') || !limoncelloText.includes('Nefertiti Custodi Nos')) {
              throw new Error('Limoncello family relationship is not explained correctly');
            }

            await browser.close();
          })();
          EOF

      - name: Smoke-test WhatsApp changes and secondary pages
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const base = process.env.BASE_URL;

            await page.goto(base + 'dogs.html', { waitUntil: 'networkidle' });
            await page.locator('#q').fill('Gyda');
            await page.locator('#profile h2').filter({ hasText: 'Gyda Bellissimo Geni' }).waitFor();
            const searchImage = page.locator('#profile .profile-media-main img');
            if (!(await searchImage.evaluate(img => img.complete && img.naturalWidth > 0))) {
              throw new Error('Gyda search did not open a loaded profile image');
            }

            await page.goto(base + 'dogs.html?dog=twice-as-tall-eden-bellissimo-geni', { waitUntil: 'networkidle' });
            const eden = await page.locator('#profile').innerText();
            for (const expected of ['Female','Grey','13/01/2025','Branco Custodi Nos','Anthie Custodi Nos']) {
              if (!eden.includes(expected)) throw new Error('Eden profile missing ' + expected);
            }

            for (const id of ['tessa-sangue-magnifica','daisy-bellissimo-geni','anthie-custodi-nos','roman-custodi-nos','birba-sangue-magnifica','zz-top-sangue-magnifica','limoncello-sangue-magnifica-custodi-nos']) {
              await page.goto(base + 'dogs.html?dog=' + id, { waitUntil: 'networkidle' });
              const img = page.locator('#profile .profile-media-main img');
              if (!(await img.evaluate(el => el.complete && el.naturalWidth > 0))) {
                throw new Error(id + ' supplied photo did not load');
              }
              if ((await img.evaluate(el => getComputedStyle(el).objectFit)) !== 'contain') {
                throw new Error(id + ' photo may crop the dog');
              }
            }

            await page.goto(base, { waitUntil: 'networkidle' });
            if (await page.locator('.legacy-family .legacy-button-gold').count()) throw new Error('Removed family CTA returned');
            if (await page.locator('.contact-band .legacy-button-outline').count()) throw new Error('Removed contact CTA returned');
            if (await page.locator('.footer-contact .legacy-button').count()) throw new Error('Removed footer CTA returned');
            if (await page.locator('.reference-social a').count() !== 3) throw new Error('Homepage social links incomplete');
            const featuredPhotos = page.locator('.featured-dog-card img');
            if (await featuredPhotos.count() !== 3) throw new Error('Homepage featured dog photography is incomplete');
            for (let i = 0; i < await featuredPhotos.count(); i++) {
              const state = await featuredPhotos.nth(i).evaluate(el => ({
                loaded: el.complete && el.naturalWidth > 0,
                fit: getComputedStyle(el).objectFit,
                width: el.getBoundingClientRect().width,
                height: el.getBoundingClientRect().height
              }));
              if (!state.loaded) throw new Error('Homepage featured dog image ' + i + ' failed to load');
              if (state.fit !== 'cover') throw new Error('Homepage featured dog image ' + i + ' is not filling the card');
              if (state.width < 1 || state.height < 1) throw new Error('Homepage featured dog image ' + i + ' has no rendered area');
            }

            await page.goto(base + 'gallery.html', { waitUntil: 'networkidle' });
            const gallery = page.locator('.gallery-grid img');
            if (await gallery.count() !== 6) throw new Error('Gallery should contain six real dog photos');
            const galleryCaptions = await page.locator('.gallery-grid figcaption').allTextContents();
            if (new Set(galleryCaptions.map(x => x.trim())).size !== galleryCaptions.length) {
              throw new Error('Main gallery repeats a dog instead of presenting six distinct subjects');
            }
            for (let i = 0; i < await gallery.count(); i++) {
              const img = gallery.nth(i);
              if (!(await img.evaluate(el => el.complete && el.naturalWidth > 0))) throw new Error('Gallery image ' + i + ' failed');
              if ((await img.evaluate(el => getComputedStyle(el).objectFit)) !== 'cover') throw new Error('Gallery image ' + i + ' is not filling its media frame');
              const pixels = await img.evaluate(el => {
                const canvas = document.createElement('canvas');
                canvas.width = 32; canvas.height = 32;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(el, 0, 0, 32, 32);
                const d = ctx.getImageData(0,0,32,32).data;
                let min=255,max=0,sum=0,n=0;
                for(let p=0;p<d.length;p+=4){
                  const y=(d[p]+d[p+1]+d[p+2])/3;
                  min=Math.min(min,y); max=Math.max(max,y); sum+=y; n++;
                }
                return {min,max,mean:sum/n};
              });
              if (pixels.max - pixels.min < 18) throw new Error('Gallery image ' + i + ' rendered as a flat/blank frame');
            }

            await page.goto(base + 'social.html', { waitUntil: 'networkidle' });
            const social = await page.locator('main').innerText();
            for (const expected of ['@bellissimogeni','Kelvin Ezekiel Omigie']) {
              if (!social.includes(expected)) throw new Error('Social page missing ' + expected);
            }

            await page.goto(base + 'contact.html', { waitUntil: 'networkidle' });
            const contact = await page.locator('main').innerText();
            for (const expected of ['+234 913 780 6866','Bellissimogenicanecorso@gmail.com']) {
              if (!contact.includes(expected)) throw new Error('Contact page missing verified detail: ' + expected);
            }
            const directWhatsApp = await page.locator('a[data-bg-whatsapp]').getAttribute('href');
            if (directWhatsApp !== 'https://wa.me/message/YSFP25LSDD7AP1') {
              throw new Error('Direct WhatsApp link is not the kennel-supplied link');
            }
            await page.locator('#apply input[name="name"]').fill('Website QA');
            await page.locator('#apply input[name="phone"]').fill('08012345678');
            await page.locator('#apply textarea[name="message"]').fill('Contact route test');
            const messageHref = await page.evaluate(() => BG.whatsappMessage('qa'));
            if (!messageHref.startsWith('https://wa.me/2349137806866?text=')) {
              throw new Error('Prefilled WhatsApp messages are not using the verified number');
            }

            const pages = ['about.html','gallery.html','puppies.html','reserve.html','breeding.html','socialization.html','standards.html','testimonials.html','contact.html','dogs.html','pedigree.html','social.html'];
            const forbidden = ['coming from the client','development placeholder','demo male','demo female','media needed:','replace all tbc','before launch'];
            for (const path of pages) {
              await page.goto(base + path, { waitUntil: 'networkidle' });
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
              if (overflow > 1) throw new Error(path + ' has horizontal overflow');
              const body = (await page.locator('body').innerText()).toLowerCase();
              for (const phrase of forbidden) if (body.includes(phrase)) throw new Error(path + ' still exposes staging copy: ' + phrase);
              const brokenImages = await page.locator('img').evaluateAll(imgs => imgs
                .filter(img => !img.complete || img.naturalWidth === 0 || img.naturalHeight === 0)
                .map(img => img.getAttribute('src') || img.getAttribute('alt') || 'unknown image'));
              if (brokenImages.length) throw new Error(path + ' contains broken images: ' + brokenImages.join(', '));
            }

            await page.goto(base + 'puppies.html', { waitUntil: 'networkidle' });
            const genericHeaderBoxes = await Promise.all([
              page.locator('.mobile-quick-links a[href="dogs.html"]').boundingBox(),
              page.locator('.mobile-quick-links a[href="puppies.html"]').boundingBox(),
              page.locator('.mobile-nav-toggle').boundingBox()
            ]);
            if (!genericHeaderBoxes.every(Boolean) || !(genericHeaderBoxes[0].x < genericHeaderBoxes[1].x && genericHeaderBoxes[1].x < genericHeaderBoxes[2].x)) {
              throw new Error('Generic mobile shortcut order must be Our Dogs, Puppies, Menu');
            }
            const mobileHeaderOverflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            if (mobileHeaderOverflow > 1) throw new Error('Generic mobile header creates horizontal overflow');

            const safeeraMobileImage = page.locator('#safeera-bellissimo-geni .puppy-card-media img');
            const safeeraMobileFrame = await safeeraMobileImage.evaluate(img => ({
              loaded: img.complete && img.naturalWidth > 0,
              fit: getComputedStyle(img).objectFit,
              height: getComputedStyle(img).height,
              naturalRatio: img.naturalWidth / img.naturalHeight,
              renderedRatio: img.getBoundingClientRect().width / img.getBoundingClientRect().height
            }));
            if (!safeeraMobileFrame.loaded || safeeraMobileFrame.fit !== 'contain') throw new Error('Safeera mobile image failed or may crop');
            if (Math.abs(safeeraMobileFrame.naturalRatio - safeeraMobileFrame.renderedRatio) > 0.03) throw new Error('Safeera mobile image aspect ratio is being forced/cropped');

            await page.setViewportSize({ width: 1365, height: 900 });
            await page.goto(base + 'puppies.html', { waitUntil: 'networkidle' });
