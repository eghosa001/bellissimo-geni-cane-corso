name: Website Screenshots

on:
  pull_request:
    paths:
      - "index.html"
      - "home-restored.css"
      - "site.js"
      - "assets/**"
      - ".github/workflows/screenshots.yml"
  workflow_run:
    workflows: ["GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Choose screenshot target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bellissimo-http.log 2>&1 &
            echo "BASE_URL=http://127.0.0.1:4173/" >> "$GITHUB_ENV"
          else
            echo "BASE_URL=https://eghosa001.github.io/bellissimo-geni-cane-corso/" >> "$GITHUB_ENV"
          fi

      - name: Capture homepage screenshots
        run: |
          mkdir -p screenshots
          node <<'EOF'
          const { chromium, devices } = require('playwright');

          async function preparePage(page, label) {
            await page.evaluate(async () => {
              await new Promise(resolve => {
                let total = 0;
                const distance = Math.max(350, Math.floor(window.innerHeight * 0.75));
                const timer = setInterval(() => {
                  window.scrollBy(0, distance);
                  total += distance;
                  if (total >= document.body.scrollHeight) {
                    clearInterval(timer);
                    window.scrollTo(0, 0);
                    setTimeout(resolve, 500);
                  }
                }, 90);
              });
            });

            await page.waitForLoadState('networkidle');
            await page.waitForTimeout(800);

            const brokenImages = await page.locator('img').evaluateAll(images =>
              images
                .filter(img => !img.complete || img.naturalWidth === 0)
                .map(img => ({ src: img.currentSrc || img.src, alt: img.alt }))
            );
            if (brokenImages.length) {
              throw new Error(label + ' has broken images: ' + JSON.stringify(brokenImages));
            }
          }

          (async () => {
            const baseUrl = process.env.BASE_URL;
            const browser = await chromium.launch({ headless: true });

            const desktop = await browser.newPage({
              viewport: { width: 1440, height: 1100 },
              deviceScaleFactor: 1
            });
            await desktop.goto(baseUrl + '?screenshot=desktop-' + Date.now(), {
              waitUntil: 'networkidle',
              timeout: 60000
            });
            await preparePage(desktop, 'desktop homepage');
            await desktop.screenshot({
              path: 'screenshots/home-desktop.png',
              fullPage: true
            });

            const mobileContext = await browser.newContext({
              ...devices['Pixel 7']
            });
            const mobile = await mobileContext.newPage();
            await mobile.goto(baseUrl + '?screenshot=mobile-' + Date.now(), {
              waitUntil: 'networkidle',
              timeout: 60000
            });
            await preparePage(mobile, 'mobile homepage');
            await mobile.screenshot({
              path: 'screenshots/home-mobile.png',
              fullPage: true
            });

            await mobileContext.close();
            await browser.close();
          })();
          EOF

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: bellissimo-homepage-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 14
