name: Verify Live Bellissimo Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-live-worker.yml"

permissions:
  contents: read

jobs:
  verify-live-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Worker health
        run: |
          set -euo pipefail
          url="https://bellissimo-geni-cane-corso.aighewieghosa111.workers.dev/webhook/health"
          body="$(curl --fail --silent --show-error --location --max-time 20 "$url")"
          echo "$body"
          node -e 'const j=JSON.parse(process.argv[1]); if(j.ok!==true) process.exit(1)' "$body"

      - name: Check public dogs API
        run: |
          set -euo pipefail
          url="https://bellissimo-geni-cane-corso.aighewieghosa111.workers.dev/api/dogs"
          body="$(curl --fail --silent --show-error --location --max-time 20 "$url")"
          echo "$body" | head -c 1000
          node -e 'const j=JSON.parse(process.argv[1]); if(j.ok!==true || !Array.isArray(j.dogs)) process.exit(1)' "$body"
