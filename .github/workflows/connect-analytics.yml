name: Connect Cloudflare Analytics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-analytics.yml']
permissions:
  contents: read
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and encrypt analytics credential for Cloudflare setup
        env:
          ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          node <<'NODE'
          const {publicEncrypt,constants}=require('node:crypto');
          const key="-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAk/Xi15jfK2/KKH+Xi+XH\nqSVSSmjZXyN/ApadY2TrmzirBYU6ryZzTeclG412RYLDYhZHYFMOje/LfFx86yFT\nX/++KGCzLZafuh7q1IYzmIdtredR9MZ5HQrpWYZ1Dferd7MfnxRiRqgq4qVmN0g9\nvy+SobqjoNmxZJGJuNDWP7Cs8ubjXrPtosdPyKahAeBxCfMwfde4xdycoweCQIAe\nciIDdWZ09qZe7DPTzEqKvw27N/KD1DfZfJgT1Ir0l08qZ/RPkJeIEmBKLEFh+ong\nYb9+xNglNyKMlsA6caZuI5K+DCoVN2qaD3GC4SvxHBdo+oPCf40R9GGI4vIRBX2A\nPV3OLIPHhY44lnQBMk6v+vtZVBsxbaJm0/u1o3PwxBMegreTL7entznWXi6Dazjs\n6mEJT1aysQU52vdIwuhoBQ2t7ObNfbA7S5mN1WyWiA9cWik7srjbRwOD61WiOLGM\nbXlQ0mRyyP4fX3THw78Lp491X5NOhOVoiofevphuodiAkvMLWXUkML6bj3REzZwd\nYPCUBEsRi6M77HkOrHgd/Ge2l8AsC252JSq1ki3QaDqICswDjja/i5sev7EvSXKK\nnkyPAvACmGwwqJfByQQkUGqlgqeyPOI1I2MoT38XgfLfOVUzPkhIYR17tIbe00l5\nv0N30kUwSXQfG2vFFhJLnFMCAwEAAQ==\n-----END PUBLIC KEY-----";
          async function main(){
            if(!process.env.ANALYTICS_TOKEN) throw new Error('Missing CLOUDFLARE_ANALYTICS_TOKEN repository secret');
            const r=await fetch('https://api.cloudflare.com/client/v4/graphql',{
              method:'POST',headers:{Authorization:'Bearer '+process.env.ANALYTICS_TOKEN,'Content-Type':'application/json'},
              body:JSON.stringify({query:'{viewer {accounts(filter:{accountTag:"19a03bec57c0277e01e1e70e241576af"}) {rumPageloadEventsAdaptiveGroups(limit:1,filter:{datetime_geq:"'+new Date(Date.now()-3600000).toISOString()+'",datetime_lt:"'+new Date().toISOString()+'",siteTag:"8fdbc4be233b49ce8f1e0b40687c2b45"}) {count}}}}'}),
              signal:AbortSignal.timeout(15000)
            });
            const data=await r.json();
            if(!r.ok||data.errors?.length||!data.data?.viewer?.accounts?.length) throw new Error('Analytics token cannot read this account; check Account Analytics Read permission.');
            const encrypted=publicEncrypt({key,padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},Buffer.from(process.env.ANALYTICS_TOKEN));
            console.log('ENCRYPTED_ANALYTICS:'+encrypted.toString('base64'));
            console.log('Analytics access validated. Credential encrypted to the setup session public key.');
          }
          main().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
