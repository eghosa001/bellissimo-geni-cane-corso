name: Connect Cloudflare Analytics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-analytics.yml']
permissions:
  contents: read
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Transfer analytics secret and verify live reports
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.BELLISSIMO_ADMIN_PASSWORD }}
        run: |
          node <<'NODE'
          const account = '19a03bec57c0277e01e1e70e241576af';
          const worker = 'bellissimo-geni-cane-corso';
          async function main() {
            for (const name of ['CF_API_TOKEN', 'ANALYTICS_TOKEN', 'ADMIN_PASSWORD']) {
              if (!process.env[name]) throw new Error('Missing repository secret for ' + name);
            }
            const check = await fetch('https://api.cloudflare.com/client/v4/graphql', {
              method: 'POST',
              headers: { Authorization: 'Bearer ' + process.env.ANALYTICS_TOKEN, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query: '{viewer {accounts(filter:{accountTag:"' + account + '"}) {rumPageloadEventsAdaptiveGroups(limit:1, filter:{datetime_geq:"' + new Date(Date.now()-3600000).toISOString() + '", datetime_lt:"' + new Date().toISOString() + '", siteTag:"8fdbc4be233b49ce8f1e0b40687c2b45"}) {count}}}}' }),
              signal: AbortSignal.timeout(15000)
            });
            const checked = await check.json();
            if (!check.ok || checked.errors?.length || !checked.data?.viewer?.accounts?.length) throw new Error('Analytics token must have Account Analytics Read for this account.');
            const put = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account + '/workers/scripts/' + worker + '/secrets', {
              method: 'PUT',
              headers: { Authorization: 'Bearer ' + process.env.CF_API_TOKEN, 'Content-Type': 'application/json' },
              body: JSON.stringify({name:'CLOUDFLARE_ANALYTICS_TOKEN',type:'secret_text',text:process.env.ANALYTICS_TOKEN}),
              signal: AbortSignal.timeout(15000)
            });
            const saved = await put.json();
            if (!put.ok || !saved.success) throw new Error('Worker secret update failed: HTTP ' + put.status);
            console.log('Read-only analytics secret saved to Worker.');
            for (const days of [7, 30]) {
              let verified = false;
              for (let attempt=0; attempt<6; attempt++) {
                const response = await fetch('https://' + worker + '.aighewieghosa111.workers.dev/admin/api/analytics?days=' + days, {
                  headers: {Authorization:'Bearer ' + process.env.ADMIN_PASSWORD},
                  signal: AbortSignal.timeout(15000)
                });
                const report = await response.json();
                if (response.ok && report.ok && report.daily?.length === days) {
                  console.log(days + '-day live report verified: ' + report.totals.visits + ' visits, ' + report.totals.pageViews + ' page views.');
                  verified = true;
                  break;
                }
                await new Promise(resolve=>setTimeout(resolve,5000));
              }
              if (!verified) throw new Error(days + '-day authenticated report did not pass.');
            }
          }
          main().catch(error=>{console.error(error.message);process.exit(1)});
          NODE
