name: Verify Visitor Reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-analytics.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authenticated analytics without publishing traffic data
        env:
          ADMIN_PASSWORD: ${{ secrets.BELLISSIMO_ADMIN_PASSWORD }}
        run: |
          node <<'NODE'
          const base='https://bellissimo-geni-cane-corso.aighewieghosa111.workers.dev';
          async function main(){
            if(!process.env.ADMIN_PASSWORD) throw new Error('Missing BELLISSIMO_ADMIN_PASSWORD repository secret');
            const unauthorized=await fetch(base+'/admin/api/analytics');
            if(unauthorized.status!==401) throw new Error('Unauthenticated report access must be denied');
            for(const days of [7,30]){
              const response=await fetch(base+'/admin/api/analytics?days='+days,{
                headers:{Authorization:'Bearer '+process.env.ADMIN_PASSWORD},
                signal:AbortSignal.timeout(15000)
              });
              const report=await response.json();
              if(!response.ok||!report.ok||report.daily?.length!==days||!Number.isFinite(report.totals?.visits)||!Number.isFinite(report.totals?.pageViews)) {
                throw new Error(days+'-day report failed: HTTP '+response.status+', '+String(report.error||'invalid_response'));
              }
              if(response.headers.get('cache-control')!=='no-store') throw new Error('Reports must not be publicly cached');
              console.log(days+'-day authenticated report passed. Traffic data omitted from logs.');
            }
          }
          main().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
