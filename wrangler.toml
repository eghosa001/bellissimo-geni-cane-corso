name = "bellissimo-geni-cane-corso"
main = "webhook/handler.js"
compatibility_date = "2024-12-01"
workers_dev = true

[cache]
enabled = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PuppyLock"]

[[durable_objects.bindings]]
name = "PUPPY_LOCK"
class_name = "PuppyLock"

[[kv_namespaces]]
binding = "RESERVATIONS"
id = "62443108e65242478947658b65f4adaf"

[[kv_namespaces]]
binding = "ADMIN"
id = "d41ceb74ca574463a698233b76e0016d"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "bellissimo-geni-cane-corso-uploads"


[vars]
PAYMENT_PROVIDER = "none"
RESERVATION_AMOUNT = "0"
PAYMENT_CURRENCY = "NGN"
RESERVATION_HOLD_HOURS = "72"
